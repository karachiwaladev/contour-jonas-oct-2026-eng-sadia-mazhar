<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>
    <form id="add-form" class="add-form">
      <input id="task-input" type="text" placeholder="New task…" autocomplete="off" required />
      <input id="due-input" type="date" title="Due date (optional)" />
      <input id="tags-input" type="text" placeholder="Tags (comma-separated)" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <div class="filters">
      <label>
        Status
        <select id="status-filter">
          <option value="all">All</option>
          <option value="active">Incomplete</option>
          <option value="complete">Complete</option>
        </select>
      </label>
      <label>
        Tag
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </label>
    </div>
    <ul id="task-list" class="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
